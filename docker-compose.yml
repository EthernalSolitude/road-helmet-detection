services:
  app:
    build: .
    container_name: helmet_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./videos:/app/videos
      - ./outputs:/app/outputs
      - ./violations_frames:/app/violations_frames
    environment:
      - DATABASE_URL=postgresql+psycopg://helmet_user:1234@db:5432/helmet_db
      - REDIS_URL=redis://redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    container_name: helmet_worker
    volumes:
      - .:/app
      - ./videos:/app/videos
      - ./outputs:/app/outputs
      - ./violations_frames:/app/violations_frames
    environment:
      - DATABASE_URL=postgresql+psycopg://helmet_user:1234@db:5432/helmet_db
      - REDIS_URL=redis://redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "9100:9100"
    command: celery -A celery_app.celery_app worker --loglevel=info --concurrency=1 -Q celery

    # Чтобы включить GPU, раскомментируй строки ниже
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  redis:
    image: redis:7-alpine
    container_name: helmet_redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

  db:
    image: postgres:16
    container_name: helmet_db
    environment:
      POSTGRES_USER: helmet_user
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: helmet_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helmet_user -d helmet_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: helmet_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
      - worker

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: helmet_jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP/HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  grafana:
    image: grafana/grafana:latest
    container_name: helmet_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
