[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/", "scripts/build_pdf.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear (likely bugs)
    "UP",     # pyupgrade (modern syntax)
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # длина строки — ruff format уже следит
    "B008",   # Depends() в FastAPI вынуждает default-call
    "RUF001", # russian comments triggers cyrillic warnings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "SIM117"]   # тесты иногда делают assert raises Exception
"conftest.py" = ["E402"]          # импорты после env-вара — by design
"alembic/versions/*" = ["E501", "I001"]  # auto-generated migrations

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "conftest.py",
    "scripts/*",
    "docs/*",
    "alembic/*",
    "alembic.ini",
    "celery_app.py",         # отдельные интеграционные тесты с воркером — отдельный сценарий
    "detection.py",          # требует загрузки YOLO — тестируем мокая
    "tasks.py",              # обёртка над detection.analyze_video
    "logging_setup.py",      # системная инициализация
    "tracing.py",             # инициализация observability
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
